name: Publish Docker images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version tag, for example v1.0.0
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and core submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          requested="${{ inputs.version }}"
          if [[ -n "$requested" ]]; then
            echo "tag=$requested" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push application
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/new-api-platform:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/new-api-platform:latest
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

      - name: Build and push portal gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/new-api-platform-gateway:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/new-api-platform-gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

